<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2a1d17">
<title>おかいもの</title>
<style>
:root{--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px)}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#2a1d17;
  overscroll-behavior:none;touch-action:none;-ms-touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:rgba(0,0,0,0);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{position:fixed;left:0;top:0;right:0;bottom:0}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:rgba(0,0,0,0)}
#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;outline:none;background:#2a1d17}
#fade{position:fixed;left:0;top:0;right:0;bottom:0;background:#1c120d;opacity:1;pointer-events:none}
#sa{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
  padding:var(--sat) var(--sar) var(--sab) var(--sal)}
#fb{position:fixed;left:0;top:0;right:0;bottom:0;display:none;
  background:radial-gradient(ellipse at 50% 40%,#f3e2c6 0%,#d9b98f 45%,#8a5f42 100%)}
#ps{position:fixed;left:0;top:0;right:0;bottom:0;display:none;overflow:hidden;pointer-events:none;background:#e6e0d6}
.ps #ps{display:block}
#ps img{position:absolute;left:-4%;top:-4%;width:108%;height:108%;object-fit:cover;display:block;
  filter:blur(10px);-webkit-filter:blur(10px)}
#fb img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
</style>
<script>
/* 読み込み中に台所のぼかし絵を出すか(おうちの場面から始まる時だけ) */
(function(){try{var h=String(location.hash||''),m=/scene=([A-Za-z0-9_-]+)/.exec(h),sc=m?m[1]:'';
if(!m&&!/(^#|[&#])reset\b/.test(h)){var d=JSON.parse(localStorage.getItem('gf-261121-1')||'null');sc=d&&d.scene||'';}
if(!sc||sc==='home1'||sc==='home2')document.documentElement.className='ps';}catch(e){document.documentElement.className='ps';}})();
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="fade"></div>
<div id="sa"></div>
<div id="ps"><!--POSTER--></div>
<noscript><style>#fb{display:block}#fade{display:none}#ps{display:none}</style></noscript>
<script>
/*__BUNDLE__*/
</script>
<script type="text/plain" id="later">
/*__LATER__*/
</script>
<div id="fb"><!--FALLBACK--></div>
</body>
</html>
