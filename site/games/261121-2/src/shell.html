<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#b9d3e6">
<title>🍅</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#b9d3e6;
  overscroll-behavior:none;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;}
body{position:fixed;inset:0;}
:root{--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);}
#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;outline:none;}
#fallback{position:fixed;inset:0;display:none;background:#b9d3e6 center/cover no-repeat;}
#fallback.on{display:block;}
#veil{position:fixed;inset:0;background:#f4efe6;pointer-events:none;opacity:1;transition:opacity .9s ease;}
#veil.off{opacity:0;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fallback" aria-hidden="true"></div>
<div id="veil" aria-hidden="true"></div>
<script>window.__FALLBACK_IMG__="/*__FALLBACK__*/";</script>
<script>/*__THREE__*/</script>
<script>/*__APP__*/</script>
</body>
</html>
